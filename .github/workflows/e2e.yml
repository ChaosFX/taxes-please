name: E2E tests

# Runs the Playwright suite against the Pages build in Chromium (Chrome, Edge),
# Firefox and WebKit (Safari, smoke set only: tests tagged @smoke). WebKit does
# not install on every Linux, so the full browser matrix runs here. Long tests
# (@long) run only on a push to main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      grep:
        description: 'Nur Tests, deren Titel hierzu passt (leer: alle)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      # Long tests (@long) only on a push to main; a given grep picks its own tests.
      - run: |
          if [ -n "$GREP" ]; then set -- --grep "$GREP"
          elif [ "$EVENT" != push ]; then set -- --grep-invert @long
          fi
          npx playwright test --project=${{ matrix.browser }} "$@"
        env:
          GREP: ${{ inputs.grep }}
          EVENT: ${{ github.event_name }}
      - uses: actions/upload-artifact@v4
        if: failure() || inputs.grep != ''
        with:
          name: playwright-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
